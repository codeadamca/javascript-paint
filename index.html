<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paint the Tree</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
        }
        
        img {
            max-width: 70vw;
            max-height: 70vh;
            object-fit: contain;
        }
        
        .button-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: scale(1.05);
        }
        
        .leaves-green {
            background-color: #238B45;
            color: white;
        }
        
        .leaves-orange {
            background-color: #FF8C00;
            color: white;
        }
        
        .trunk-grey {
            background-color: #808080;
            color: white;
        }
        
        .trunk-brown {
            background-color: #8B5A2B;
            color: white;
        }
    </style>
</head>
<body>
    
    <div class="button-container">
        <button class="leaves-green" onclick="changeLeaves('#238B45')">Green Leaves</button>
        <button class="leaves-orange" onclick="changeLeaves('#FF8C00')">Orange Leaves</button>
        <button class="trunk-grey" onclick="changeTrunk('#808080')">Grey Trunk</button>
        <button class="trunk-brown" onclick="changeTrunk('#8B5A2B')">Brown Trunk</button>
    </div>
    
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
        <!-- Trunk Shape -->
        <path id="trunk" 
              d="M 360,570 
                   L 360,450 
                   C 360,440 370,430 400,430 
                   C 430,430 440,440 440,450 
                   L 440,570 
                   C 475,575 510,580 530,600 
                   C 510,600 450,595 440,595 
                   L 440,610 
                   C 440,620 430,625 400,625 
                   C 370,625 360,620 360,610 
                   L 360,595 
                   C 350,595 290,600 270,600 
                   C 290,580 325,575 360,570 Z" 
              fill="#8B5A2B" 
              stroke="#000000" 
              stroke-width="14" 
              stroke-linejoin="round" 
              stroke-linecap="round" />

        <!-- Leaves Shape -->
        <path id="leaves" 
              d="M 400,210 
                   C 440,210 475,225 500,250 
                   C 530,230 570,235 595,265 
                   C 625,290 635,335 620,370 
                   C 650,400 655,445 635,480 
                   C 615,515 570,535 530,525 
                   C 505,555 460,570 420,560 
                   C 380,570 335,555 310,525 
                   C 270,535 225,515 205,480 
                   C 185,445 190,400 220,370 
                   C 205,335 215,290 245,265 
                   C 270,235 310,230 340,250 
                   C 365,225 400,210 400,210 Z" 
              fill="#238B45" 
              stroke="#000000" 
              stroke-width="16" 
              stroke-linejoin="round" />
    </svg>

    <script>
        function changeLeaves(color) {
            document.getElementById('leaves').setAttribute('fill', color);
        }
        
        function changeTrunk(color) {
            document.getElementById('trunk').setAttribute('fill', color);
        }
    </script>

</body>
</html>
